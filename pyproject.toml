[project]
name = "limen-rf"
version = "0.1.0"
description = "Anytime-valid predictive-rank detection with a statically contaminated fixed reference set"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limen_rf"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Publication experiment drivers are frozen research artifacts. Keep their
# source stable after outcome generation; lint the reusable package/tests.
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
