name: REDIN manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/redin-pdf.yml"
  workflow_dispatch:

jobs:
  build:
    name: XeLaTeX identified and blind manuscripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication snapshot
        uses: actions/checkout@v4

      - name: Restore official REDIN template assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from urllib.request import urlopen
          from zipfile import ZipFile
          from io import BytesIO
          from shutil import copy2

          url = "https://revistas.udea.edu.co/public/site/images/sandra-123/latex_template.zip?download=1"
          destination = Path("paper/redin")
          files = {
              "redina.cls": destination / "packages/redina.cls",
              "lineno.sty": destination / "packages/lineno.sty",
              "redin.png": destination / "images/redin_logos/redin.png",
              "udea.png": destination / "images/redin_logos/udea.png",
          }
          with urlopen(url, timeout=90) as response:
              zip_bytes = response.read()
          with TemporaryDirectory() as directory:
              with ZipFile(BytesIO(zip_bytes)) as archive:
                  archive.extractall(directory)
              matches = list(Path(directory).rglob("*"))
              for name, target in files.items():
                  sources = [file for file in matches if file.is_file() and file.name == name]
                  if not sources:
                      raise SystemExit(f"REDIN template missing: {name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  copy2(sources[0], target)
                  print(f"Restored {name} -> {target}")
          PY

      - name: Build both versions with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          texlive_version: 2026
          working_directory: paper/redin
          root_file: |
            article.tex
            article_blind.tex
          latexmk_use_xelatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Check article PDFs and journal page limit
        shell: bash
        run: |
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          for filename in ("article.pdf", "article_blind.pdf"):
              path = Path("paper/redin") / filename
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit(f"Missing or truncated output: {path}")
              count = len(PdfReader(path).pages)
              print(f"{filename}: {count} pages, {path.stat().st_size} bytes")
              if count > 20:
                  raise SystemExit(f"REDIN page limit exceeded in {filename}: {count} > 20")
          PY

      - name: Upload publication PDFs
        uses: actions/upload-artifact@v4
        with:
          name: redin-manuscripts
          path: |
            paper/redin/article.pdf
            paper/redin/article_blind.pdf
          if-no-files-found: error
